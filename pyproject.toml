[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memctrl-llm"
version = "0.1.0"
description = "Task-aware memory management for LLMs. Extend conversations 5.7x longer with 88% recall."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kamalasankari Subramaniakuppusamy"},
]
keywords = [
    "llm", "memory", "context-window", "token-optimization",
    "ai", "compression", "task-aware",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "sentence-transformers>=2.2.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30.0"]
openai = ["openai>=1.0.0"]
ui = ["gradio>=4.0.0"]
all = [
    "anthropic>=0.30.0",
    "openai>=1.0.0",
    "gradio>=4.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
memctrl = "memctrl.interfaces.cli:cli"

[project.urls]
Homepage = "https://github.com/KamalasankariS/MemCtrl"
Repository = "https://github.com/KamalasankariS/MemCtrl"
Issues = "https://github.com/KamalasankariS/MemCtrl/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=memctrl --cov-report=html --cov-report=term"

[tool.setuptools.packages.find]
include = ["memctrl*"]
